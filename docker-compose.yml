services:
  nginx:
    image: nginx:alpine
    container_name: mingle-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      user-service:
        condition: service_healthy
      user-service-2:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      chat-service-2:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USER_SERVICE_URL: ${NEXT_PUBLIC_USER_SERVICE_URL:-/user}
        NEXT_PUBLIC_CHAT_SERVICE_URL: ${NEXT_PUBLIC_CHAT_SERVICE_URL:-/chat}
    container_name: mingle-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./backend/user
      dockerfile: Dockerfile
    container_name: mingle-user-1
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGO_URI: mongodb://mongo:27017/mingle-user
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-mingle}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5003:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-service-2:
    build:
      context: ./backend/user
      dockerfile: Dockerfile
    container_name: mingle-user-2
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGO_URI: mongodb://mongo:27017/mingle-user
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-mingle}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mail-service:
    build:
      context: ./backend/mail
      dockerfile: Dockerfile
    container_name: mingle-mail
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-mingle}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  chat-service:
    build:
      context: ./backend/chat
      dockerfile: Dockerfile
    container_name: mingle-chat-1
    environment:
      PORT: 5002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGO_URI: mongodb://mongo:27017/mingle-chat
      REDIS_URL: redis://redis:6379
      USER_SERVICES: http://user-service:5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "127.0.0.1:5004:5002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

  chat-service-2:
    build:
      context: ./backend/chat
      dockerfile: Dockerfile
    container_name: mingle-chat-2
    environment:
      PORT: 5002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGO_URI: mongodb://mongo:27017/mingle-chat
      REDIS_URL: redis://redis:6379
      USER_SERVICES: http://user-service:5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

  mongo:
    image: mongo:7
    container_name: mingle-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mingle-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: mingle-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-mingle}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
